name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skill headers
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              m = re.match(r"---\n(.*?)\n---\n", f.read_text(encoding="utf-8"), re.S)
              meta = dict(l.split(": ", 1) for l in m.group(1).splitlines() if ": " in l) if m else {}
              if meta.get("name") != f.parent.name:
                  bad.append(f"{f}: name must be {f.parent.name!r}")
              if not 0 < len(meta.get("description", "")) <= 1024:
                  bad.append(f"{f}: description missing or over 1024 characters")
          print("\n".join(bad) or "all skill headers ok")
          sys.exit(1 if bad else 0)
          PY
      - name: scrub-private-data self-test
        run: python3 -I skills/scrub-private-data/test_scan.py
      - name: gitgud-release self-test
        run: python3 -I skills/gitgud-release/test_changelog.py
